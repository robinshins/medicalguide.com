name: Publish Articles

on:
  schedule:
    # 2026-07-25에 12회 → 7회로 축소 (그 이전엔 24회). 이 사이트와 치과 사이트가
    # 글 1편당 13개 언어를 만들어 OpenAI 소비의 대부분을 차지했고, 둘 다 12회면
    # 일 3.55M으로 무료 한도 2.5M을 42% 초과했다. 각 7회면 합쳐 2.32M(93%)이다.
    # 치과와 같은 OpenAI 키를 공유하므로 실행 시각이 겹치지 않게 분산해 둔다.
    - cron: '31 15 * * *'   # KST 00:31
    - cron: '53 17 * * *'   # KST 02:53
    - cron: '36 21 * * *'   # KST 06:36
    - cron: '18 1 * * *'    # KST 10:18
    - cron: '44 3 * * *'    # KST 12:44
    - cron: '52 5 * * *'    # KST 14:52
    - cron: '39 9 * * *'    # KST 18:39
  workflow_dispatch: # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create .env.local
        run: |
          cat > .env.local << 'EOF'
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          EOF

      - name: Create Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > medicalkorea-2205a-firebase-adminsdk-fbsvc-70fd6e21f4.json

      - name: Publish next article
        run: node publish-action.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CHROME_PATH: /usr/bin/google-chrome-stable

      - name: Submit to IndexNow
        if: success()
        run: node indexnow-submit.js
